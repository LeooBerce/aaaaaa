<!DOCTYPE html>
<html lang="pt-BR">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="imagem-container">
            <img id="imagem-cena" src="" alt="Cena da missão">
        </div>

        <div id="caixa-pergunta">
            <!-- Texto da pergunta aparece aqui -->
        </div>

        <div id="caixa-alternativas">
            <!-- Botões das alternativas aparecem aqui -->
        </div>

        <div id="caixa-final" class="escondido">
            <h2 id="titulo-final"></h2>
            <p id="texto-final"></p>
            <button id="botao-reiniciar">Jogar novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
